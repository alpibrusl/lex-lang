# docsync.toml — generated documentation blocks (lex doc-sync / --check).
# Each target's stdout-producing generator is the source of truth; CI runs
# `lex doc-sync --check` so drift is a red build, never a discovery.

[[block]]
id = "effects"
path = "docs/AGENT.md"
command = "cargo run -q -p lex-cli -- docs --effects"

# The stdlib module/function index in the agent reference — generated
# from the type-checker's builtin registry (lex-types builtins.rs
# MODULE_NAMES + module_scope), so the docs cannot list a function the
# checker would reject (#746).
[[block]]
id = "stdlib-index"
path = "docs/AGENT.md"
command = "cargo run -q -p lex-cli -- docs --stdlib-index"
