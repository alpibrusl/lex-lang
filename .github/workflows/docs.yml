name: docs

# Generate machine-readable API docs (`lex docs --output json`, #564) for
# this repo's example Lex sources, render them (plus the curated docs/*.md
# set and the landing page) into a static site with `sitegen/generate.lex`,
# and — on push to `main` — publish it to GitHub Pages at doc.lexlang.org.
#
# This finishes #567: the `api-docs` job used to be the non-deploying half
# (JSON only, uploaded as a build artifact); `docs-site` now wires that JSON
# to a published site, and `deploy` publishes it via Actions-based Pages
# (replacing the old branch+path `/docs` mechanism — see
# scripts/setup-pages.sh, which targets that older mechanism and should not
# be re-run now that Pages' build type is "workflow").
#
# `docs-site` runs on pull_request too (not just push) so a change that
# breaks generation — a `sitegen/*.lex` bug, a docs/*.md edit that trips the
# Markdown-lite converter, a `lex docs` schema change — fails CI on the PR,
# before it ever reaches `main`, rather than only being noticed by looking
# at the deployed site after merge.
#
# Requires a `lex` that supports `lex docs --output json <path>` (#564). The
# job builds `lex` from this checkout, so the docs always track the current
# toolchain. Merge order matters: this can only run green once #564 is on
# `main`.
#
# #1042 adds real proof on top of the rendered doc comments: every example
# is `lex check --strict`'d against this checkout's own freshly-built `lex`
# (a hard pass/fail — see scripts/verify-docs-examples.py), and the subset
# whose doc comment shows a real `lex run ...`/`lex check ...` command gets
# that command actually EXECUTED, plus a self-hosted terminal recording of
# the real execution (scripts/record-docs-examples.py — best-effort,
# soft-fail; see that script's own doc comment for why recording tooling
# availability is never a reason to fail this job, while the check/run
# proof always is).
#
# Release gating: this repo has no separate pre-tag gate workflow today —
# release.yml triggers directly off `v*` tag pushes (or workflow_dispatch)
# with no dependency on other workflows' status, and verify-release.yml
# explicitly documents itself as running only *after* a release is
# published, as a post-hoc smoke test, "intentionally NOT a gate on the
# release itself". The thing that already functions as a pre-release gate
# in this project is this job's own `push: branches: [main]` /
# `pull_request` triggers (same as ci.yml's tests) — a tag only gets cut
# once main is green, and green here now requires every docs example to
# still check and run. So #1042's verification step is added to *this*
# existing job/trigger pair rather than inventing a parallel
# release-gating mechanism.

on:
  push:
    branches: [main]
    paths:
      - 'examples/**.lex'
      - 'docs/**.md'
      - 'sitegen/**'
      - 'crates/lex-cli/src/docs.rs'
      - 'scripts/check-docs-site.py'
      - 'scripts/verify-docs-examples.py'
      - 'scripts/record-docs-examples.py'
      - 'scripts/docs_examples_lib.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'examples/**.lex'
      - 'docs/**.md'
      - 'sitegen/**'
      - 'crates/lex-cli/src/docs.rs'
      - 'scripts/check-docs-site.py'
      - 'scripts/verify-docs-examples.py'
      - 'scripts/record-docs-examples.py'
      - 'scripts/docs_examples_lib.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      source-path:
        description: 'Directory of .lex sources to document'
        default: 'examples'
        required: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The lex-cli dep graph (lex-runtime → arrow-rs/Polars) inflates
      # target/; reclaim runner space the same way ci.yml does so the
      # debug build doesn't exhaust the disk.
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Debug build: doc generation is parse-only, so the release
      # optimizer buys nothing here. Build just the `lex` bin.
      - name: Build lex
        run: cargo build --bin lex
      - name: Generate API docs JSON
        env:
          SRC: ${{ github.event.inputs.source-path || 'examples' }}
        run: |
          mkdir -p site
          ./target/debug/lex --output json docs "$SRC" > site/api-docs.json
          # Human-readable render to the job log for a quick eyeball.
          ./target/debug/lex docs "$SRC"
      - name: Validate API docs JSON
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("site/api-docs.json"))
          assert d["ok"], "lex docs reported failure"
          mods = d["data"]["modules"]
          fns = sum(len(m["functions"]) for m in mods)
          print(f"documented {len(mods)} module(s), {fns} function(s)")
          assert mods, "no modules documented"
          PY
      # #1042 hard gate: every examples/**.lex file must still
      # `lex check --strict` against the `lex` this job just built, and
      # every doc comment's own `Run:` command must actually behave as
      # documented when executed for real (server examples are proven via
      # their own documented `curl`/WS traffic, not just an exit code from
      # a process that's designed to run forever — see the script's doc
      # comment). Bare `lex` on PATH resolves to this checkout's binary so
      # the doc comments' own literal `lex run ...` / `lex check ...`
      # commands work unmodified — same commands a reader would copy-paste.
      # Writes site/verify-results.json, which sitegen/verify.lex renders
      # into each guide page's "✓ verified" badge, and
      # site/runnable-examples.json, the exact {file, run} set the
      # (soft-fail) recording step below replays — never re-derived, so a
      # recording can never drift from what was actually proven to work.
      - name: Verify docs examples (type-check + real run) — hard gate
        env:
          SRC: ${{ github.event.inputs.source-path || 'examples' }}
        run: |
          export PATH="$PWD/target/debug:$PATH"
          python3 scripts/verify-docs-examples.py \
            --lex-bin ./target/debug/lex \
            --src "$SRC" \
            --api-docs site/api-docs.json \
            --out site/verify-results.json
      - name: Show verify-results.json
        if: always()
        run: cat site/verify-results.json
      # Best-effort only (see record-docs-examples.py's doc comment): a
      # missing/broken `asciinema` here is a warning, never a failed
      # build. pip over apt-get — a pinned, modern version without an
      # `apt-get update` round trip, and it's what's actually reliable
      # across ubuntu-latest images (apt's asciinema package version has
      # drifted between runner images before).
      - name: Install asciinema (best-effort)
        continue-on-error: true
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pip install --user --quiet 'asciinema>=2.4,<3'
      - name: Record docs examples (best-effort)
        continue-on-error: true
        run: |
          export PATH="$PWD/target/debug:$HOME/.local/bin:$PATH"
          python3 scripts/record-docs-examples.py \
            --runnable site/runnable-examples.json \
            --api-docs site/api-docs.json \
            --out-dir site/recordings
      # Self-hosted playback (no runtime request to asciinema.org) —
      # vendor asciinema-player's own published JS/CSS bundle once, at
      # build time, same footing as the recordings themselves: regenerated
      # every push, never committed. Best-effort, same reasoning as the
      # recording step above: if a given CI environment can't reach
      # jsdelivr, sitegen/verify.lex falls back to a plain download link
      # for the raw .cast instead of a broken/missing player.
      - name: Vendor asciinema-player (self-hosted, best-effort)
        continue-on-error: true
        env:
          ASCIINEMA_PLAYER_VERSION: '3.17.0'
        run: |
          mkdir -p site/vendor
          curl -fsSL --retry 3 -o site/vendor/asciinema-player.min.js \
            "https://cdn.jsdelivr.net/npm/asciinema-player@${ASCIINEMA_PLAYER_VERSION}/dist/bundle/asciinema-player.min.js"
          curl -fsSL --retry 3 -o site/vendor/asciinema-player.min.css \
            "https://cdn.jsdelivr.net/npm/asciinema-player@${ASCIINEMA_PLAYER_VERSION}/dist/bundle/asciinema-player.min.css"
      # The site generator is itself a Lex program (dogfooding, per
      # lex-www's generate.lex convention) — see sitegen/generate.lex for
      # why. `--allow-fs-write _site` scopes its write authority to
      # exactly the output directory; it never touches the source tree.
      # `--allow-fs-read examples` is new: the per-example on-site source
      # pages (sitegen/generate.lex's build_source_page) read the real
      # `.lex` files directly, not just the `site/api-docs.json` JSON.
      - name: Generate docs site
        run: |
          ./target/debug/lex run --allow-effects fs_read,fs_write \
            --allow-fs-read docs --allow-fs-read sitegen --allow-fs-read site \
            --allow-fs-read examples --allow-fs-write _site \
            sitegen/generate.lex main
      # The CI gate for #567's "never drifts" requirement: a PR that
      # breaks Markdown rendering, drops a page, or dangles a link fails
      # here, not just at deploy time.
      - name: Validate generated site
        run: python3 scripts/check-docs-site.py
      - uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: site/api-docs.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: _site
          if-no-files-found: error

  deploy:
    needs: docs-site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
