[workspace]
resolver = "2"
members = [
    "crates/lex-syntax",
    "crates/lex-ast",
    "crates/lex-types",
    "crates/lex-bytecode",
    "crates/lex-jit",
    "crates/lex-store",
    "crates/lex-search",
    "crates/lex-vcs",
    "crates/lex-trace",
    "crates/lex-runtime",
    "crates/lex-cli",
    "crates/lex-api",
    "crates/lex-lsp",
    "crates/core-compiler",
    "crates/spec-checker",
    "crates/conformance",
]
# `fuzz/` is a separate crate driven by `cargo fuzz` (libFuzzer +
# nightly). Excluded from the main workspace so `cargo build/test
# --workspace` on stable doesn't try to compile it.
exclude = ["fuzz"]

[workspace.package]
version = "0.10.12"
edition = "2021"
# Minimum supported Rust. Determined empirically, not aspirationally: the
# floor is `libsqlite3-sys` (via rusqlite → lex-runtime), whose *build
# script* uses `cfg_select!`, stabilized in 1.95. It declares no
# rust-version of its own, so `cargo metadata` reports a floor of 1.93
# (cranelift/wasmtime) and only an actual build finds the real one.
#
# Declaring it here turns a confusing E0658 deep inside a C-binding crate
# into cargo's own "requires rustc 1.95" message, before anything compiles.
# Verified: `cargo check --workspace --all-targets` fails on 1.93 and
# 1.94.1, passes on 1.95.0. Raise this only with the same evidence.
rust-version = "1.95"
license = "EUPL-1.2"
repository = "https://github.com/alpibrusl/lex-lang"
homepage = "https://github.com/alpibrusl/lex-lang"
authors = ["Alpibrupa <https://github.com/alpibrupa>"]
keywords = ["lex", "agent", "effects", "language"]
categories = ["compilers", "development-tools"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
anyhow = "1"
logos = "0.16"
indexmap = { version = "2", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
getrandom = "0.4"
hex = "0.4"
