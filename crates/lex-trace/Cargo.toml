[package]
name = "lex-trace"
description = "Run-time trace tree + replay for Lex programs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
indexmap.workspace = true
lex-bytecode = { path = "../lex-bytecode", version = "0.11.0" }
lex-ast = { path = "../lex-ast", version = "0.11.0" }

[dev-dependencies]
lex-syntax = { path = "../lex-syntax", version = "0.11.0" }
# No `version`, deliberately: lex-runtime depends on lex-store, which
# depends on lex-trace, so a versioned dev-dependency here closes a cycle
# that cannot be published in any order. Cargo strips a path-only
# dev-dependency from the published manifest, which is the documented way
# to break exactly this.
lex-runtime = { path = "../lex-runtime" }
